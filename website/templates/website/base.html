<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}An Nhiên Hotel{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #24332e;
            background: #f7f8f5;
            line-height: 1.6;
        }

        a {
            color: inherit;
        }

        .container {
            width: min(1120px, 92%);
            margin: auto;
        }

        .header {
            background: white;
            border-bottom: 1px solid #e2e7e2;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding: 20px 0;
        }

        .brand {
            color: #245b48;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-link {
            text-decoration: none;
            font-weight: bold;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .messages {
            margin: 20px auto 0;
            padding: 14px 18px;
            border: 1px solid #b9d9c2;
            border-radius: 10px;
            background: #e8f5eb;
            color: #245b48;
        }

        .messages p {
            margin: 0;
        }

        .hero {
            padding: 64px 0;
            background: #e8f0e9;
        }

        .hero h1 {
            margin: 8px 0 16px;
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.2;
        }

        .hero p {
            max-width: 600px;
            color: #53665c;
        }

        .eyebrow {
            color: #245b48;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .section {
            padding: 48px 0;
        }

        .section h2 {
            margin-top: 0;
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
            gap: 24px;
        }

        .room-card {
            overflow: hidden;
            background: white;
            border: 1px solid #e2e7e2;
            border-radius: 16px;
        }

        .room-placeholder {
            display: grid;
            place-items: center;
            height: 180px;
            background: #dce8df;
            color: #355d48;
        }

        .room-content {
            padding: 24px;
        }

        .room-content h3 {
            margin: 0 0 8px;
            font-size: 23px;
        }

        .muted {
            color: #63736b;
        }

        .price {
            margin-bottom: 0;
            color: #245b48;
            font-size: 22px;
            font-weight: bold;
        }

        .price span {
            color: #63736b;
            font-size: 14px;
            font-weight: normal;
        }

        .footer {
            padding: 24px 0;
            border-top: 1px solid #e2e7e2;
            color: #63736b;
        }

        .room-image {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .button {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        border-radius: 8px;
        background: #245b48;
        color: white;
        text-decoration: none;
        font-weight: bold;
        }

        .button:hover {
        background: #194332;
        }

        .detail-image {
        display: block;
        width: 100%;
        max-height: 480px;
        object-fit: cover;
        border-radius: 16px;
        }

        .booking-search {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            align-items: end;
            gap: 16px;
            margin-top: 28px;
            padding: 20px;
            border: 1px solid #d5e0d7;
            border-radius: 14px;
            background: white;
        }

        .form-field label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            width: 100%;
            min-height: 42px;
            padding: 8px 10px;
            border: 1px solid #cbd5ce;
            border-radius: 7px;
            font: inherit;
        }

        .booking-search .button {
            margin-top: 0;
            min-height: 42px;
            border: 0;
            cursor: pointer;
            font: inherit;
        }

        .form-errors {
            margin: 0 0 18px;
            padding: 12px 16px;
            border-radius: 8px;
            background: #fff0ed;
            color: #8d291b;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
            gap: 18px;
        }

        .service-card {
            padding: 22px;
            border: 1px solid #e2e7e2;
            border-radius: 12px;
            background: white;
        }

        .service-card h3 {
            margin: 0 0 8px;
        }

        .booking-summary {
            padding: 18px;
            border-radius: 10px;
            background: #e8f0e9;
        }

        .booking-estimate {
            grid-column: 1 / -1;
            margin: 0;
            color: #245b48;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a class="brand" href="{% url 'website:room_list' %}">
                An Nhiên Hotel
            </a>

            <nav class="nav-links" aria-label="Điều hướng chính">
                <a class="nav-link" href="{% url 'website:room_list' %}#rooms">Phòng nghỉ</a>
                <a class="nav-link" href="{% url 'website:room_list' %}#services">Dịch vụ</a>
                <a class="nav-link" href="{% url 'website:room_list' %}#booking-search">Tìm phòng</a>
            </nav>
        </div>
    </header>

    <main>
        {% if messages %}
            <div class="container messages" role="status">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            © {% now "Y" %} An Nhiên Hotel
        </div>
    </footer>
</body>
</html>
